apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "impala.fullname" . }}-catalogd
  labels:
{{ include "impala.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "impala.name" . }}
      app.kubernetes.io/component: catalogd
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "impala.name" . }}
        app.kubernetes.io/component: catalogd
{{- if or .Values.security.istio.enabled .Values.security.istio.podAnnotations }}
      annotations:
{{- if .Values.security.istio.enabled }}
        sidecar.istio.io/inject: "true"
{{- end }}
{{- with .Values.security.istio.podAnnotations }}
{{ toYaml . | indent 8 }}
{{- end }}
{{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: catalogd
          image: {{ include "impala.image" (dict "Values" .Values "imageName" "catalogd") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -redirect_stdout_stderr=false
            - -logtostderr
            - -v={{ .Values.catalogd.v }}
            - -state_store_host={{ .Values.statestore.host | default (printf "%s-statestored" (include "impala.fullname" .)) }}
            - -hms_event_polling_interval_s={{ .Values.catalogd.hmsEventPollingIntervalS }}
            - -invalidate_tables_timeout_s={{ .Values.catalogd.invalidateTablesTimeoutS }}
{{- if or .Values.impalad.kuduMasterHosts .Values.kudu.enabled }}
            - -kudu_master_hosts={{ .Values.impalad.kuduMasterHosts | default (printf "%s:%d" (include "impala.kuduMasterService" .) (.Values.kudu.master.rpcPort | int)) }}
{{- end }}
{{- if .Values.auth.ranger.enabled }}
            - -authorization_provider=ranger
            - -ranger_service_type={{ .Values.auth.ranger.serviceType }}
            - -ranger_app_id={{ .Values.auth.ranger.appId }}
            - -server_name={{ .Values.auth.ranger.serverName }}
{{- end }}
{{- if .Values.security.kerberos.enabled }}
            - -principal={{ required "security.kerberos.principal is required when security.kerberos.enabled=true" .Values.security.kerberos.principal }}
{{- if .Values.security.kerberos.bePrincipal }}
            - -be_principal={{ .Values.security.kerberos.bePrincipal }}
{{- end }}
            - -keytab_file={{ printf "%s/%s" .Values.security.kerberos.keytabMountPath .Values.security.kerberos.keytabFileName }}
{{- if .Values.security.kerberos.krb5ConfigMapName }}
            - -krb5_conf={{ printf "%s/%s" .Values.security.kerberos.krb5ConfigMountPath .Values.security.kerberos.krb5ConfigFileName }}
{{- end }}
{{- end }}
{{- if .Values.security.tls.enabled }}
            - -ssl_server_certificate={{ printf "%s/%s" .Values.security.tls.mountPath .Values.security.tls.certFileName }}
            - -ssl_private_key={{ printf "%s/%s" .Values.security.tls.mountPath .Values.security.tls.keyFileName }}
            - -webserver_certificate_file={{ printf "%s/%s" .Values.security.tls.mountPath .Values.security.tls.certFileName }}
            - -webserver_private_key_file={{ printf "%s/%s" .Values.security.tls.mountPath .Values.security.tls.keyFileName }}
{{- if .Values.security.tls.clientCaFileName }}
            - -ssl_client_ca_certificate={{ printf "%s/%s" .Values.security.tls.mountPath .Values.security.tls.clientCaFileName }}
{{- end }}
{{- end }}
{{- range .Values.catalogd.extraArgs }}
            - {{ . | quote }}
{{- end }}
          ports:
            - name: rpc
              containerPort: 26000
            - name: web
              containerPort: 25020
          volumeMounts:
            - name: warehouse
              mountPath: /user/hive/warehouse
            - name: conf
              mountPath: /opt/impala/conf/hive-site.xml
              subPath: hive-site.xml
{{- if .Values.auth.ranger.enabled }}
            - name: conf
              mountPath: /opt/impala/conf/ranger-hive-security.xml
              subPath: ranger-hive-security.xml
            - name: conf
              mountPath: /opt/impala/conf/ranger-hive-audit.xml
              subPath: ranger-hive-audit.xml
{{- end }}
{{- if .Values.security.kerberos.enabled }}
            - name: kerberos-keytab
              mountPath: {{ printf "%s/%s" .Values.security.kerberos.keytabMountPath .Values.security.kerberos.keytabFileName }}
              subPath: {{ .Values.security.kerberos.keytabFileName }}
              readOnly: true
{{- if .Values.security.kerberos.krb5ConfigMapName }}
            - name: kerberos-krb5
              mountPath: {{ printf "%s/%s" .Values.security.kerberos.krb5ConfigMountPath .Values.security.kerberos.krb5ConfigFileName }}
              subPath: {{ .Values.security.kerberos.krb5ConfigFileName }}
              readOnly: true
{{- end }}
{{- end }}
{{- if .Values.security.tls.enabled }}
            - name: tls-certs
              mountPath: {{ .Values.security.tls.mountPath }}
              readOnly: true
{{- end }}
      volumes:
        - name: conf
          configMap:
            name: {{ include "impala.fullname" . }}-conf
        - name: warehouse
{{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "impala.fullname" . }}-warehouse
{{- else }}
          emptyDir: {}
{{- end }}
{{- if .Values.security.kerberos.enabled }}
        - name: kerberos-keytab
          secret:
            secretName: {{ required "security.kerberos.keytabSecretName is required when security.kerberos.enabled=true" .Values.security.kerberos.keytabSecretName }}
{{- if .Values.security.kerberos.krb5ConfigMapName }}
        - name: kerberos-krb5
          configMap:
            name: {{ .Values.security.kerberos.krb5ConfigMapName }}
{{- end }}
{{- end }}
{{- if .Values.security.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ required "security.tls.secretName is required when security.tls.enabled=true" .Values.security.tls.secretName }}
{{- end }}
