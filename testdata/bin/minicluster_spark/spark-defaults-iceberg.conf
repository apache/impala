# Appended to the mounted spark-defaults.conf by run-spark.sh when the Iceberg Spark
# runtime jar is mounted too. The catalog names mirror the Trino catalogs in
# testdata/bin/minicluster_trino, so the same table is reachable under the same
# name from either engine.

# Iceberg's SQL extensions (CALL, MERGE INTO on v2 tables, ALTER TABLE ... WRITE
# ORDERED BY, ...). Naming a class that is not on the classpath makes every
# session fail to start, hence appending this only when the jar is mounted.
spark.sql.extensions \
    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Make the built-in catalog Iceberg-aware, so a table Impala created resolves under
# the name Impala uses, e.g. 'default.ti_variant' rather than only
# 'iceberg.default.ti_variant'. Without this, unqualified names go through Spark's
# Hive path, which tries to load Iceberg's Hive storage handler
# (HiveIcebergSerDe/HiveIcebergStorageHandler) and fails with
# ClassNotFoundException: the Spark runtime jar does not contain it. Plain Hive
# tables still work; SparkSessionCatalog delegates those to the session catalog.
spark.sql.catalog.spark_catalog          org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type     hive

# 'iceberg': tables in the HiveCatalog of our HMS, i.e. the same catalog Impala
# uses by default.
spark.sql.catalog.iceberg               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type          hive
spark.sql.catalog.iceberg.uri           thrift://localhost:9083

# 'iceberg_hadoop': a HadoopCatalog living only in HDFS, with no HMS involvement.
# This is the only catalog Spark can CREATE or INSERT INTO a GEOMETRY/GEOGRAPHY table
# through: committing via the HiveCatalog re-syncs the HMS column list through
# Iceberg's Hive schema converter, which throws
# 'UnsupportedOperationException: geometry(OGC:CRS84) is not supported' because the
# Hive type system has no geometry. Reading a geometry table from any catalog is
# fine, since Iceberg takes the schema from the metadata JSON rather than from HMS.
# Impala reads tables here via TBLPROPERTIES ('iceberg.catalog'='hadoop.catalog',
# 'iceberg.catalog_location'=<warehouse>, 'iceberg.table_identifier'=<ns.table>).
spark.sql.catalog.iceberg_hadoop        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg_hadoop.type   hadoop
spark.sql.catalog.iceberg_hadoop.warehouse \
    hdfs://localhost:20500/test-warehouse/spark_hadoop_catalog

# 'iceberg_rest': the Iceberg REST catalog started by
# tests/common/iceberg_rest_server.py.
spark.sql.catalog.iceberg_rest          org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg_rest.type     rest
spark.sql.catalog.iceberg_rest.uri      http://localhost:9084
spark.sql.catalog.iceberg_rest.warehouse \
    hdfs://localhost:20500/test-warehouse/iceberg_test/hadoop_catalog

# 'iceberg_lakekeeper': the Lakekeeper REST catalog started by
# testdata/bin/run-lakekeeper.sh, authenticating against its Keycloak.
spark.sql.catalog.iceberg_lakekeeper    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg_lakekeeper.type rest
spark.sql.catalog.iceberg_lakekeeper.uri http://localhost:8181/catalog
spark.sql.catalog.iceberg_lakekeeper.warehouse lakekeeper_demo
spark.sql.catalog.iceberg_lakekeeper.credential impala-client:impala-client-secret
spark.sql.catalog.iceberg_lakekeeper.oauth2-server-uri \
    http://localhost:7070/realms/lakekeeper-realm/protocol/openid-connect/token
