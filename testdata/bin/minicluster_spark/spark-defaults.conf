# Everything runs inside the single container, so use a local master. The
# minicluster is already memory hungry; keep Spark's footprint small.
spark.master                            local[2]
spark.driver.memory                     2g
spark.sql.shuffle.partitions            4

# Legacy (non-Iceberg) tables live in the built-in 'spark_catalog', backed by the
# minicluster HMS. The metastore URI comes from the copied hive-site.xml; the
# bundled Hive 2.3 metastore client talks to our Hive 3 HMS over Thrift.
spark.sql.catalogImplementation         hive

# The driver UI would default to 4040, which is a common port to have taken on a
# development machine shared with other containers.
spark.ui.port                           9093

# Spark 4.1 keeps GEOMETRY/GEOGRAPHY and the ST functions behind this internal flag,
# so geometry interop cannot be exercised without it. Note that even with the flag
# the SQL parser only accepts the parameterized spelling, e.g. 'geometry(4326)'.
# Spark 4.2 enables the geospatial types by default, where this is a no-op.
spark.sql.geospatial.enabled            true
