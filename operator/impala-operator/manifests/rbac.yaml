apiVersion: v1
kind: Namespace
metadata:
  name: impala-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: impala-operator
  namespace: impala-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: impala-operator-control-plane
rules:
  - apiGroups: ["impala.apache.org"]
    resources: ["impalaclusters"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["impala.apache.org"]
    resources: ["impalaclusters/status", "impalaclusters/finalizers"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: impala-operator-control-plane
subjects:
  - kind: ServiceAccount
    name: impala-operator
    namespace: impala-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: impala-operator-control-plane
---
# Namespaced resources managed by Helm for core + optional components.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: impala-operator-helm
rules:
  - apiGroups: [""]
    resources:
      - "configmaps"
      - "endpoints"
      - "persistentvolumeclaims"
      - "pods"
      - "secrets"
      - "serviceaccounts"
      - "services"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: impala-operator-helm
subjects:
  - kind: ServiceAccount
    name: impala-operator
    namespace: impala-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: impala-operator-helm
