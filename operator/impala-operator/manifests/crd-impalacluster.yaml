apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: impalaclusters.impala.apache.org
spec:
  group: impala.apache.org
  scope: Namespaced
  names:
    kind: ImpalaCluster
    singular: impalacluster
    plural: impalaclusters
    shortNames:
      - icluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                impalaReleaseName:
                  type: string
                  default: impala
                ldapReleaseName:
                  type: string
                  default: impala-ldap
                ldapEnabled:
                  type: boolean
                ldapUri:
                  type: string
                ldapBindPattern:
                  type: string
                kuduEnabled:
                  type: boolean
                rangerEnabled:
                  type: boolean
                rangerAuthEnabled:
                  type: boolean
                storageClassName:
                  type: string
                impalaChartPath:
                  type: string
                  description: Path in operator container for Impala chart.
                impalaValuesFile:
                  type: string
                  description: Path in operator container for Impala values file.
                ldapValuesFile:
                  type: string
                  description: Path in operator container for LDAP values file.
                helmTimeoutSeconds:
                  type: integer
                  minimum: 60
                  default: 900
                set:
                  type: object
                  additionalProperties:
                    type: string
                  description: Extra Helm --set values merged into release.
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                lastReconcileTime:
                  type: string
                targetNamespace:
                  type: string
